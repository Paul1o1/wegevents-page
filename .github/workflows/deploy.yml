name: Deploy Website to cPanel FTP

on:
  push:
    branches:
      - main  # Changes trigger whenever Pages CMS updates your main branch
  workflow_dispatch:  # Allows manual 1-click trigger from GitHub Actions

jobs:
  web-deploy:
    name: FTP Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: 🐍 Set up Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install Pillow

    - name: 🖼️ Optimize images & generate WebP variants
      run: python scripts/optimize_images.py

    - name: 🛠️ Compile website with latest CMS content
      run: python scripts/build.py
    
    - name: 📂 Sync files to cPanel
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: ./
