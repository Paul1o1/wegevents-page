name: Deploy Website to cPanel FTP

on:
  push:
    branches:
      - main  # Changes trigger whenever Pages CMS updates your main branch
  workflow_dispatch:  # Allows manual 1-click trigger from GitHub Actions

jobs:
  web-deploy:
    name: FTP Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 🐍 Set up Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install Pillow

    - name: 🖼️ Optimize images & generate WebP variants
      run: python scripts/optimize_images.py

    - name: 🛠️ Compile website with latest CMS content
      run: python scripts/build.py

    - name: 💾 Commit compiled website back to repo
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add -A
        git diff --staged --quiet || (git commit -m "Auto-compile website from CMS updates [skip ci]" && git push origin main)
    
    - name: 📂 Sync files to cPanel
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: ./
