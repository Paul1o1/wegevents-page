# ============================================================
# WEG Events — Pages CMS Configuration
# Place this file at the root of your GitHub repository.
# Documentation: https://pagescms.org/docs/
# ============================================================

# Where uploaded media files will be stored
media: images

# ============================================================
# CONTENT DEFINITIONS
# Each entry maps to a page file your client can edit.
# ============================================================
content:

  # ----------------------------------------------------------
  # 0. GLOBAL SETTINGS — Contact Info & Social Media Links
  # ----------------------------------------------------------
  - name: settings
    label: "⚙️ Global Settings"
    path: data/settings.json
    format: json
    type: file
    fields:

      # ── CONTACT INFORMATION ─────────────────────────────────
      - name: company_email
        label: "Contact — Email Address (e.g. info@wegevents.et)"
        type: string

      - name: company_phone
        label: "Contact — Phone Number (displayed, e.g. +251 954 920 010)"
        type: string

      - name: company_phone_tel
        label: "Contact — Phone for tel: link (no spaces, e.g. +251954920010)"
        type: string

      - name: company_location
        label: "Contact — City & Country (e.g. Addis Ababa, Ethiopia)"
        type: string

      - name: company_location_subtext
        label: "Contact — Location Sub-text (e.g. Available for destination celebrations worldwide)"
        type: string

      # ── SOCIAL MEDIA LINKS ──────────────────────────────────
      - name: instagram_url
        label: "Social — Instagram URL (e.g. https://instagram.com/wegevents)"
        type: string

      - name: tiktok_url
        label: "Social — TikTok URL (e.g. https://tiktok.com/@wegevents)"
        type: string

      - name: linkedin_url
        label: "Social — LinkedIn URL"
        type: string

      - name: telegram_url
        label: "Social — Telegram URL (e.g. https://t.me/wegevents)"
        type: string

      # ── FOOTER ──────────────────────────────────────────────
      - name: footer_copyright
        label: "Footer — Copyright Text (e.g. © 2025 WEG Events. All rights reserved.)"
        type: string

  # ----------------------------------------------------------
  # 1. HOME PAGE  (index.html)
  # ----------------------------------------------------------
  - name: home
    label: "🏠 Home Page"
    path: data/home.json
    format: json
    type: file
    fields:

      # ── SEO ────────────────────────────────────────────────
      - name: seo_title
        label: "SEO — Browser Tab Title"
        type: string

      - name: seo_description
        label: "SEO — Meta Description (shown in Google results)"
        type: text

      # ── HERO ───────────────────────────────────────────────
      - name: hero_tagline
        label: "Hero — Tagline Under Logo"
        type: string

      - name: hero_left_label
        label: "Hero — Left Side Label (e.g. Based In Addis Ababa)"
        type: string

      - name: hero_right_label
        label: "Hero — Right Side Label (e.g. Available In Ethiopia)"
        type: string

      - name: hero_video_src
        label: "Hero — Background Video File (.mp4)"
        type: file
        categories:
          - video
        extensions:
          - mp4
          - webm
          - mov

      - name: hero_video_poster
        label: "Hero — Video Fallback / Poster Image"
        type: image

      # ── ETHOS / OUR STORY ──────────────────────────────────
      - name: ethos_badge_text
        label: "Our Story — Badge Text (e.g. Our Story)"
        type: string

      - name: ethos_headline
        label: "Our Story — Main Headline"
        type: string

      - name: ethos_philosophy_title
        label: "Our Story — Left Column Title (e.g. The WEG Philosophy)"
        type: string

      - name: ethos_philosophy_body
        label: "Our Story — Left Column Description"
        type: text

      - name: ethos_journey_title
        label: "Our Story — Right Column Title (e.g. Our Journey)"
        type: string

      - name: ethos_journey_body
        label: "Our Story — Right Column Description"
        type: text

      - name: ethos_stat1_number
        label: "Our Story — Stat 1 Number (e.g. 50+)"
        type: string

      - name: ethos_stat1_label
        label: "Our Story — Stat 1 Label (e.g. Events)"
        type: string

      - name: ethos_stat1_text
        label: "Our Story — Stat 1 Description"
        type: text

      - name: ethos_stat2_number
        label: "Our Story — Stat 2 Number (e.g. 3)"
        type: string

      - name: ethos_stat2_label
        label: "Our Story — Stat 2 Label (e.g. Founders)"
        type: string

      - name: ethos_stat2_text
        label: "Our Story — Stat 2 Description"
        type: text

      - name: ethos_stat3_number
        label: "Our Story — Stat 3 Number (e.g. 100%)"
        type: string

      - name: ethos_stat3_label
        label: "Our Story — Stat 3 Label (e.g. Dedicated)"
        type: string

      - name: ethos_stat3_text
        label: "Our Story — Stat 3 Description"
        type: text

      # ── SERVICES SHOWCASE ──────────────────────────────────
      - name: services_eyebrow
        label: "Services — Small Eyebrow Text (e.g. Bespoke Event Solutions)"
        type: string

      - name: services_headline
        label: "Services — Section Headline (e.g. Our Services)"
        type: string

      - name: services_description
        label: "Services — Short Description Below Headline"
        type: text

      - name: services_bg_image
        label: "Services — Background Photo"
        type: image

      # ── GALLERY PREVIEW CARDS ──────────────────────────────
      - name: gallery_section_eyebrow
        label: "Gallery Preview — Eyebrow Text (e.g. Captured Moments)"
        type: string

      - name: gallery_section_headline
        label: "Gallery Preview — Main Headline"
        type: string

      - name: gallery_section_intro
        label: "Gallery Preview — Introductory Paragraph"
        type: text

      - name: gallery_card1_image
        label: "Gallery Card 1 — Photo"
        type: image

      - name: gallery_card1_category
        label: "Gallery Card 1 — Category Tag (e.g. Destination Wedding)"
        type: string

      - name: gallery_card1_title
        label: "Gallery Card 1 — Couple/Event Name"
        type: string

      - name: gallery_card1_description
        label: "Gallery Card 1 — Short Description"
        type: text

      - name: gallery_card2_image
        label: "Gallery Card 2 — Photo"
        type: image

      - name: gallery_card2_category
        label: "Gallery Card 2 — Category Tag"
        type: string

      - name: gallery_card2_title
        label: "Gallery Card 2 — Couple/Event Name"
        type: string

      - name: gallery_card2_description
        label: "Gallery Card 2 — Short Description"
        type: text

      - name: gallery_card3_image
        label: "Gallery Card 3 — Photo"
        type: image

      - name: gallery_card3_category
        label: "Gallery Card 3 — Category Tag"
        type: string

      - name: gallery_card3_title
        label: "Gallery Card 3 — Couple/Event Name"
        type: string

      - name: gallery_card3_description
        label: "Gallery Card 3 — Short Description"
        type: text

      - name: gallery_card4_image
        label: "Gallery Card 4 — Photo"
        type: image

      - name: gallery_card4_category
        label: "Gallery Card 4 — Category Tag"
        type: string

      - name: gallery_card4_title
        label: "Gallery Card 4 — Couple/Event Name"
        type: string

      - name: gallery_card4_description
        label: "Gallery Card 4 — Short Description"
        type: text

      # ── TESTIMONIALS ───────────────────────────────────────
      - name: testimonials
        label: "Client Testimonials & Reviews"
        type: object
        list:
          collapsible: true
          collapsed: true
          summary: "{author}"
        fields:
          - name: author
            label: "Couple / Client Name (e.g. — Sofia & Luca)"
            type: string
          - name: quote
            label: "Review / Quote Text"
            type: text
          - name: image
            label: "Background Photo"
            type: image

      # ── FAQ ────────────────────────────────────────────────
      - name: faq_section_headline
        label: "FAQ — Section Headline"
        type: string

      - name: faq_section_intro
        label: "FAQ — Introductory Paragraph"
        type: text

      - name: faqs
        label: "FAQ Questions & Answers"
        type: object
        list:
          collapsible: true
          collapsed: true
          summary: "{question}"
        fields:
          - name: question
            label: "Question"
            type: string
          - name: answer
            label: "Answer"
            type: text

      # ── PRE-FOOTER CTA ─────────────────────────────────────
      - name: cta_headline
        label: "Call-to-Action Banner — Headline"
        type: string

      - name: cta_subtext
        label: "Call-to-Action Banner — Supporting Text"
        type: text

      # ── FOOTER ─────────────────────────────────────────────
      - name: footer_brand_tagline
        label: "Footer — Brand Description Paragraph"
        type: text

      - name: footer_email
        label: "Footer — Contact Email Address"
        type: string

      - name: footer_phone
        label: "Footer — Contact Phone Number"
        type: string

      - name: footer_location
        label: "Footer — Location Text"
        type: string

      - name: footer_instagram_url
        label: "Footer — Instagram Profile URL"
        type: string

      - name: footer_tiktok_url
        label: "Footer — TikTok Profile URL"
        type: string

      - name: footer_linkedin_url
        label: "Footer — LinkedIn Profile URL"
        type: string

      - name: footer_telegram_url
        label: "Footer — Telegram Link (e.g. https://t.me/wegevents)"
        type: string

      - name: footer_copyright
        label: "Footer — Copyright Line (e.g. © 2025 Weg Events. All rights reserved.)"
        type: string

  # ----------------------------------------------------------
  # 2. ABOUT US PAGE  (about.html)
  # ----------------------------------------------------------
  - name: about
    label: "ℹ️ About Us Page"
    path: data/about.json
    format: json
    type: file
    fields:
      - name: about_seo_title
        label: "SEO — Browser Tab Title"
        type: string
      - name: about_seo_description
        label: "SEO — Meta Description"
        type: text

      - name: about_hero_bg
        label: "Hero — Background Image"
        type: image
      - name: about_hero_eyebrow
        label: "Hero — Eyebrow Subtitle"
        type: string
      - name: about_hero_headline
        label: "Hero — Main Headline"
        type: string
      - name: about_hero_subheadline
        label: "Hero — Sub-headline Description"
        type: text

      - name: about_origin_eyebrow
        label: "Story Origin — Eyebrow (e.g. The Origin)"
        type: string
      - name: about_origin_headline
        label: "Story Origin — Headline"
        type: string
      - name: about_origin_image
        label: "Story Origin — Founders Photo"
        type: image

      - name: about_mission_eyebrow
        label: "Mission — Eyebrow"
        type: string
      - name: about_mission_title
        label: "Mission — Title"
        type: string

      - name: about_vision_eyebrow
        label: "Vision — Eyebrow"
        type: string
      - name: about_vision_title
        label: "Vision — Title"
        type: string

      - name: about_team_headline
        label: "Team Section — Headline"
        type: string

      - name: team_members
        label: "Team Members & Planners"
        type: object
        list:
          collapsible: true
          collapsed: true
          summary: "{name} ({role})"
        fields:
          - name: name
            label: "Member Name"
            type: string
          - name: role
            label: "Role / Title (e.g. Co-Founder & Lead Planner)"
            type: string
          - name: image
            label: "Headshot Photo"
            type: image

  # ----------------------------------------------------------
  # 3. SERVICES PAGE  (service.html)
  # ----------------------------------------------------------
  - name: service
    label: "🛠️ Services Page"
    path: data/service.json
    format: json
    type: file
    fields:
      - name: service_seo_title
        label: "SEO — Browser Tab Title"
        type: string
      - name: service_seo_description
        label: "SEO — Meta Description"
        type: text

      - name: service_hero_bg
        label: "Hero — Background Image"
        type: image
      - name: service_hero_eyebrow
        label: "Hero — Eyebrow Subtitle"
        type: string
      - name: service_hero_headline
        label: "Hero — Main Headline"
        type: string
      - name: service_hero_subheadline
        label: "Hero — Sub-headline Description"
        type: text

      - name: service1_image
        label: "Package 1 — Photo"
        type: image
      - name: service1_badge
        label: "Package 1 — Badge (e.g. Package 01)"
        type: string
      - name: service1_title
        label: "Package 1 — Package Name"
        type: string

      - name: service2_image
        label: "Package 2 — Photo"
        type: image
      - name: service2_badge
        label: "Package 2 — Badge"
        type: string
      - name: service2_title
        label: "Package 2 — Package Name"
        type: string

      - name: service3_image
        label: "Package 3 — Photo"
        type: image
      - name: service3_badge
        label: "Package 3 — Badge"
        type: string
      - name: service3_title
        label: "Package 3 — Package Name"
        type: string

      - name: service4_image
        label: "Package 4 — Photo"
        type: image
      - name: service4_badge
        label: "Package 4 — Badge"
        type: string
      - name: service4_title
        label: "Package 4 — Package Name"
        type: string

  # ----------------------------------------------------------
  # 4. PROCESS PAGE  (process.html)
  # ----------------------------------------------------------
  - name: process
    label: "⚙️ Our Process Page"
    path: data/process.json
    format: json
    type: file
    fields:
      - name: process_seo_title
        label: "SEO — Browser Tab Title"
        type: string
      - name: process_seo_description
        label: "SEO — Meta Description"
        type: text

      - name: process_hero_bg
        label: "Hero — Background Image"
        type: image
      - name: process_hero_eyebrow
        label: "Hero — Eyebrow Subtitle"
        type: string
      - name: process_hero_headline
        label: "Hero — Main Headline"
        type: string
      - name: process_hero_subheadline
        label: "Hero — Sub-headline Description"
        type: text

      - name: process_section_eyebrow
        label: "Steps Section — Eyebrow"
        type: string
      - name: process_section_headline
        label: "Steps Section — Headline"
        type: string
      - name: process_section_intro
        label: "Steps Section — Intro Text"
        type: text

      - name: process_step1_title
        label: "Step 1 — Title (e.g. Initial Inquiry)"
        type: string

      - name: process_step2_title
        label: "Step 2 — Title (e.g. Review Our Packages)"
        type: string

      - name: process_step3_title
        label: "Step 3 — Title (e.g. Booking & Execution)"
        type: string

  # ----------------------------------------------------------
  # 5. CONTACT PAGE  (contact.html)
  # ----------------------------------------------------------
  - name: contact
    label: "📞 Contact Us Page"
    path: data/contact.json
    format: json
    type: file
    fields:
      - name: contact_seo_title
        label: "SEO — Browser Tab Title"
        type: string
      - name: contact_seo_description
        label: "SEO — Meta Description"
        type: text

      - name: contact_hero_bg
        label: "Hero — Background Image"
        type: image
      - name: contact_hero_eyebrow
        label: "Hero — Eyebrow Subtitle"
        type: string
      - name: contact_hero_headline
        label: "Hero — Main Headline"
        type: string
      - name: contact_hero_subheadline
        label: "Hero — Sub-headline Description"
        type: text

      - name: contact_panel_eyebrow
        label: "Info Box — Eyebrow (e.g. Direct Reach)"
        type: string
      - name: contact_panel_title
        label: "Info Box — Title (e.g. Get In Touch)"
        type: string

  # ----------------------------------------------------------
  # 6. GALLERY PAGE  (gallery.html)
  # ----------------------------------------------------------
  - name: gallery
    label: "🖼️ Gallery Page"
    path: data/gallery.json
    format: json
    type: file
    fields:
      - name: gallery_seo_title
        label: "SEO — Browser Tab Title"
        type: string
      - name: gallery_seo_description
        label: "SEO — Meta Description"
        type: text

      - name: gallery_hero_eyebrow
        label: "Hero — Eyebrow Subtitle"
        type: string
      - name: gallery_hero_headline
        label: "Hero — Main Headline"
        type: string
      - name: gallery_hero_subheadline
        label: "Hero — Sub-headline Description"
        type: text

      - name: gallery_cards
        label: "Gallery Celebrations"
        type: object
        list:
          collapsible: true
          collapsed: true
          summary: "{title} ({category})"
        fields:
          - name: image
            label: "Photo"
            type: image
          - name: category
            label: "Category Tag (e.g. Destination Wedding, Cultural Mels, Weddings, Corporate)"
            type: string
          - name: title
            label: "Couple / Event Name"
            type: string
          - name: description
            label: "Short Story / Description"
            type: text
          - name: link
            label: "Story Link (e.g. contact.html or /case-study/story-name.html)"
            type: string
          - name: button_text
            label: "Button Text (e.g. View Gallery)"
            type: string
          - name: photos
            label: "Celebration Photos (9 Photos for 3x3 Grid)"
            type: image
            list: true
